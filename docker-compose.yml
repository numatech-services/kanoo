version: '3.8'

services:
  kanoo-db:
    image: mongo:6.0
    container_name: kanoo-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data: