# Kanoo — Configuration Nginx
# Hostinger VPS Ubuntu 22.04
# Modifier : votre-domaine.ne → votre domaine réel

# ── Redirection HTTP → HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.ne www.votre-domaine.ne;
    
    # Certification Let's Encrypt (Certbot l'ajoute automatiquement)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    return 301 https://$host$request_uri;
}

# ── HTTPS principal ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.ne www.votre-domaine.ne;

    # Certificats Let's Encrypt (générés par Certbot)
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.ne/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.ne/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité SSL ──────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Headers de sécurité ───────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/numapilot-access.log;
    error_log  /var/log/nginx/numapilot-error.log warn;

    # ── Taille max upload (documents, logos) ─────────────────────────────────
    client_max_body_size 20M;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/x-javascript text/xml
        application/xml application/rss+xml
        image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # ── Assets statiques Next.js — cache long ────────────────────────────────
    location /_next/static/ {
        alias /var/www/kanoo/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fichiers publics ──────────────────────────────────────────────────────
    location /icons/ {
        root /var/www/kanoo/public;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Service Worker — pas de cache ────────────────────────────────────────
    location = /sw.js {
        root /var/www/kanoo/public;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
    }

    # ── Manifest PWA ─────────────────────────────────────────────────────────
    location = /manifest.json {
        root /var/www/kanoo/public;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/manifest+json";
    }

    # ── Application Next.js (proxy vers PM2 port 3000) ───────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts généreux pour les exports PDF et téléchargements
        proxy_connect_timeout  60s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;
    }
}
